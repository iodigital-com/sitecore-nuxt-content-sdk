version: 2
updates:
  # Nuxt package dependencies
  - package-ecosystem: 'npm'
    directory: '/packages/nuxt'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'automerge'
    commit-message:
      prefix: 'chore(deps):'
    open-pull-requests-limit: 10

  # Vue package dependencies
  - package-ecosystem: 'npm'
    directory: '/packages/vue'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'automerge'
    commit-message:
      prefix: 'chore(deps):'
    open-pull-requests-limit: 10

  # Root dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'automerge'
    commit-message:
      prefix: 'chore(deps):'
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'automerge'
    commit-message:
      prefix: 'chore(ci):'
    open-pull-requests-limit: 5
